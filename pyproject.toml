[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "courtvision"
version = "0.1.0"
description = "CourtVision AI / AthletaTrack: Physics-informed multi-object tracking and spatial analytics for broadcast football"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "matplotlib>=3.11.2",
    "numpy>=2.0.0",
    "opencv-python>=4.10.0",
    "pydantic>=2.10.0",
    "scipy>=1.14.0",
    "soccernet>=0.2.0",
    "supervision>=0.25.0",
    "tabulate>=0.9.0",
    "torch>=2.2.0",
    "trackeval",
    "ultralytics>=8.3.0",
    "uvicorn[standard]>=0.30.0",
    "yt-dlp>=2024.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["courtvision*"]

[tool.uv.sources]
trackeval = { git = "https://github.com/JonathonLuiten/TrackEval.git" }
